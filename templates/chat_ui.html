<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parenting Guidance Chatbot</title>
<style>
    body {
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f4f0ec;
        margin: 0;
        display: flex;
        justify-content: center;
        padding: 20px;
    }
    .chat-container {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        display: flex;
        flex-direction: column;
        height: 85vh;
        overflow: hidden;
    }
    .chat-header {
        background: #7a6a58;
        color: white;
        padding: 18px 20px;
        font-size: 18px;
        font-weight: 600;
    }
    .chat-header span {
        display: block;
        font-size: 13px;
        font-weight: 400;
        opacity: 0.85;
        margin-top: 2px;
    }
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.4;
        font-size: 14.5px;
    }
    .msg.bot {
        background: #ece5dc;
        color: #2f2a24;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }
    .msg.user {
        background: #7a6a58;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }
    .msg.typing {
        background: #ece5dc;
        color: #888;
        align-self: flex-start;
        font-style: italic;
    }
    .chat-input {
        display: flex;
        border-top: 1px solid #eee;
        padding: 10px;
        gap: 8px;
    }
    .chat-input input {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 20px;
        padding: 10px 16px;
        font-size: 14.5px;
        outline: none;
    }
    .chat-input input:focus {
        border-color: #7a6a58;
    }
    .chat-input button {
        background: #7a6a58;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 18px;
        font-size: 14.5px;
        cursor: pointer;
    }
    .chat-input button:hover {
        background: #6a5b4a;
    }
    .chat-input button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        Parenting Guidance Assistant
        <span>Ask me anything about raising your child</span>
    </div>
    <div class="chat-messages" id="messages">
        <div class="msg bot">Hi! I'm here to help with parenting questions — feel free to ask me anything.</div>
    </div>
    <div class="chat-input">
        <input type="text" id="questionInput" placeholder="Type your question..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('questionInput');
    const messages = document.getElementById('messages');
    const sendBtn = document.getElementById('sendBtn');
    const question = input.value.trim();
    if (!question) return;

    const userMsg = document.createElement('div');
    userMsg.className = 'msg user';
    userMsg.textContent = question;
    messages.appendChild(userMsg);

    input.value = '';
    sendBtn.disabled = true;
    messages.scrollTop = messages.scrollHeight;

    const typingMsg = document.createElement('div');
    typingMsg.className = 'msg typing';
    typingMsg.textContent = 'Typing...';
    messages.appendChild(typingMsg);
    messages.scrollTop = messages.scrollHeight;

    try {
        const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: question })
        });
        const data = await response.json();

        typingMsg.remove();

        const botMsg = document.createElement('div');
        botMsg.className = 'msg bot';
        botMsg.textContent = data.answer;
        messages.appendChild(botMsg);
    } catch (err) {
        typingMsg.remove();
        const errMsg = document.createElement('div');
        errMsg.className = 'msg bot';
        errMsg.textContent = "Sorry, something went wrong. Please try again.";
        messages.appendChild(errMsg);
    }

    sendBtn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
    input.focus();
}
</script>

</body>
</html>
